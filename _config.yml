# GitHub Pages: publishes README.md as https://nehemiahj.github.io/sitecore-scheduled-publish/
title: Sitecore Scheduled Publish
description: >-
  Open-source Sitecore module to schedule publish and unpublish of items for a future date and time,
  with notifications. Supports Sitecore XM/XP 10.2 - 10.5 (IAR, Package Designer not required),
  NuGet package and Docker images for Windows Server 2025 and 2022.
url: https://nehemiahj.github.io
baseurl: /sitecore-scheduled-publish
lang: en
author: Nehemiah Jeyakumar
theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
github:
  is_project_page: true
exclude:
  - src
  - Packages
  - scripts
  - docker
  - Documentation
  - artifacts
  - .config
  - .github
  - ScheduledPublish.sln
  - sitecore.json
  - NuGet.config
