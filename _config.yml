# GitHub Pages: index.md (which includes README.md) is published as https://nehemiahj.github.io/sitecore-scheduled-publish/
title: Sitecore Scheduled Publish
description: >-
  Open-source Sitecore module to schedule publish and unpublish of items, with notifications.
  Sitecore XM/XP 10.2-10.5, IAR, NuGet and Docker.
url: https://nehemiahj.github.io
baseurl: /sitecore-scheduled-publish
lang: en
author: Nehemiah Jeyakumar
theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
github:
  is_project_page: true
exclude:
  - README.md
  - src
  - Packages
  - scripts
  - docker
  - Documentation
  - artifacts
  - .config
  - .github
  - ScheduledPublish.sln
  - sitecore.json
  - NuGet.config
